[project]
name = "book-rag"
version = "0.1.0"
description = "Transform a book (EPUB/TXT) into an index so agents can retrieve verbatim, high-fidelity chunks with provenance."
requires-python = ">=3.12"
dependencies = [
    "ebooklib",
    "sqlite-vec",
    "charset-normalizer",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9,<2"]  # 1.x line: stable FastMCP API (2.0 restructured the SDK)

[project.scripts]
book-rag = "book_rag.cli:main"
book-rag-mcp = "book_rag.mcp_server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_rag"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real-Ollama end-to-end tests (auto-skipped when Ollama is not running)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
